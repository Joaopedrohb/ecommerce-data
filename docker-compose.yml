services:

  postgres:
    image: postgres:16
    container_name: ecommerce-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: data_engineer
      POSTGRES_PASSWORD: data_engineer_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: